<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vyapaar Vikash</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-auth">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon" style="width:38px;height:38px;font-size:1.1rem;">🌱</div>
      Vyapaar Vikash
    </div>

    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-sub">Sign in to your Vyapaar Vikash account to continue.</p>

    <form action="../pages/dashboard.html" method="GET">
      <div class="form-group">
        <label class="form-label" for="username">Username / Mobile <span class="required">*</span></label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username or mobile number" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <div class="d-flex justify-between align-center mb-3">
        <label class="form-check">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="#" style="color:var(--orange); font-size:0.88rem; font-weight:600;">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">Sign In</button>
    </form>

    <p style="text-align:center; margin-top:24px; color:var(--gray-600); font-size:0.88rem;">
      Don't have an account? <a href="register.html" style="color:var(--orange); font-weight:600;">Register here</a>
    </p>
    <p style="text-align:center; margin-top:16px;">
      <a href="../index.html" style="color:var(--gray-600); font-size:0.88rem;">← Back to Home</a>
    </p>
  </div>

</body>
</html>
